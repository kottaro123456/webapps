<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Webアプリお知らせ一覧</title>
    <meta charset="UTF-8" lang="ja">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Webアプリのお知らせ一覧です。">
    <!--SNSでのサイト表示-->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:site" content="@MiyakoCam">
    <meta property="twitter:description" content="Webアプリのお知らせ一覧です。">
    <meta property="og:title" content="Webアプリお知らせ一覧">
    <meta property="og:image" content="https://kottaro123456.com/webapps/og.png">
    <meta property="og:site_name" content="Webアプリお知らせ一覧">
    <!--その他のCSS・ライブラリ読み込み-->
    <script src="https://kit.fontawesome.com/e9f92a9dd0.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <link rel="stylesheet" href="index.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZL8HPL24E7"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-ZL8HPL24E7');
    </script>
    <style>
        .new {
            background: #ffb4b4;
            border: none;
            text-align: center;
            height: 0;
            font-size: 1.5rem;
            opacity: 0;
            transition: 0.5s;
            margin: 0 10vw;
            padding: 0 10px;
            line-height: 1.45em;
            overflow: hidden;
            pointer-events: none;
        }

        .new.display {
            opacity: 1;
            height: calc(2rem + 10px);
            margin: 1rem 10vw;
            margin-bottom: 0;
            padding: 15px;
            border: #ff1b5f 2.5px solid;
            pointer-events: auto;
        }

        .news {
            padding: 5vh 10vw;
            padding-top: 2rem;
        }

        .news_content {
            padding: 0.6em 1em;
            border-bottom: 1px solid #808080;
            display: flex;
            flex-direction: column;
        }

        .news_content a {
            color: #4040ff;
            text-decoration: none;
            cursor: pointer;
        }

        .news_content a:hover {
            text-decoration: underline;
        }

        #new_closebtn {
            position: absolute;
            top: calc(20px + 6rem + 10px);
            right: 7vw;
            font-size: 1.8rem;
            user-select: none;
            cursor: pointer;
        }

        #new_closebtn.more::before {
            content: '新しいお知らせを見る';
            font-size: 1.1rem;
            font-family: "UD新ゴ-Pro", sans-serif;
            font-weight: 300;
            display: inline-block;
            transform: translateY(-10px);
        }

        .news_date {
            display: flex;
            justify-content: space-between;
        }

        .news_date span {
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="title">
        <img src="source/og.png" style="height: 2em;"> お知らせ一覧
    </div>
    <a href="../" class="backhome">&#12288;← メインページへ戻る&#12288;</a>

    <p style="text-align: left;"><a href="cmscore/" class="" style="font-size: 1rem;">&#12288;CMSCORE →&#12288;</a></p>

    <div class="new"><span style="color: #ff1b5f;background: white;font-weight: 500;">NEW!</span> <a href="0023/"
            class="normallink">震度分布図アップデートのお知らせ</a> があります。</div>
    <span class="material-symbols-rounded" id="new_closebtn">unfold_less</span>
    <div class="news" id="newsContainer">
        <!-- JSONから動的に記事一覧が挿入されます -->
    </div>

    <script>
        fetch('news_data.json?_=' + new Date().getTime(), { cache: 'no-store' })
            .then(response => response.json())
            .then(data => {
                if (data.length > 0) {
                    // 最新記事で NEW! エリアを更新
                    const latest = data[0];
                    const newHtml = `<span style="color: #ff1b5f;background: white;font-weight: 500;">NEW!</span> <a href="${latest.id}/" class="normallink">${latest.title}</a> があります。`;
                    const newDiv = document.querySelector('.new');
                    newDiv.innerHTML = newHtml;

                    // 記事一覧の生成
                    const container = document.getElementById('newsContainer');
                    data.forEach(item => {
                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'news_content';
                        contentDiv.innerHTML = `
                            <div class="news_date">
                                <span>${item.date}</span>
                                <span>${item.appHtml}</span>
                            </div>
                            <a href="${item.id}/">${item.title}</a>
                        `;
                        container.appendChild(contentDiv);
                    });

                    // NEW! 表示/非表示ロジック
                    const currentLatestId = latest.id;
                    let storedSeenId = localStorage.getItem('news_already');

                    localStorage.setItem('news_already', data[0].id); // 新しい仕様(IDのみ)で上書き保存

                    const closeBtn = document.getElementById('new_closebtn');

                    // 保存されているIDと違えば（新しい記事なら）表示
                    if (storedSeenId !== currentLatestId) {
                        newDiv.classList.add('display');
                        closeBtn.innerText = 'unfold_less';
                        closeBtn.classList.remove('more');
                    } else {
                        // 既に見た（閉じた）のと同じ記事IDなら非表示
                        newDiv.classList.remove('display');
                        closeBtn.classList.add('more');
                        closeBtn.innerText = 'unfold_more';
                    }

                    // 開閉ボタンクリック処理
                    closeBtn.addEventListener("click", () => {
                        if (newDiv.classList.contains('display')) {
                            // 閉じるとき
                            newDiv.classList.remove('display');
                            closeBtn.classList.add('more');
                            closeBtn.innerText = 'unfold_more';

                            // 記事を見た（閉じた）ということを LocalStorage に保存
                            localStorage.setItem('news_already', currentLatestId);
                        } else {
                            // もう一度開くとき
                            newDiv.classList.add('display');
                            closeBtn.innerText = 'unfold_less';
                            closeBtn.classList.remove('more');
                        }
                    });
                }
            })
            .catch(error => console.error('Error fetching news:', error));
    </script>
    <script src="../../static/font/fonts.php"></script>
    <script></script>
</body>

</html>
